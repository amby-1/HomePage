<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research - Mechatronics Laboratory</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .group-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
    @media (max-width:900px){.group-cards{grid-template-columns:1fr}}
    .group-card{border:2px solid #ddd;border-radius:10px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;display:block}
    .group-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}
    .group-card img{width:90%;height:auto;object-fit:contain;display:block;margin:0 auto 16px}
    .group-card.takaki{border-color:#cfe0ff;background:#f0f5ff}
    .group-card.ambe{border-color:#cfe9d8;background:#f0faf3}
    .group-card .body{padding:16px}
    .group-card .title{margin:0 0 6px 0;color:var(--primary-color);font-size:1.2rem}
    .group-card .desc{margin:0;color:#555}
    .note{margin-top:10px;color:#666;font-size:.95rem}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <script src="../js/header-en.js"></script>

  <main class="container">
    <h2>Research</h2>
    <p class="note">
      Our research is organized into two groups. Please choose the group you are interested in.
    </p>

    <div class="group-cards">
      <a class="group-card takaki" href="research.html">
        <div class="body">
          <h3 class="title">Takaki Group</h3>
          <p class="desc">(Currently under construction)</p>
        </div>
        <img src="../research/takaki/assets/takakiTopics.png" alt="Takaki Group" />
      </a>

      <a class="group-card ambe" href="research.html">
        <div class="body">
          <h3 class="title">Ambe Group</h3>
          <p class="desc">(Currently under construction)</p>
        </div>
        <img src="../research/ambe/assets/ambeTopics.png" alt="Ambe Group" />
      </a>
    </div>
  </main>

    <div id="site-footer"></div>
    <script src="../js/footer-en.js"></script>
</body>
</html>
